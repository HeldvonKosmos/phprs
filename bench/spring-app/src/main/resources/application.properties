spring.application.name=spring-app
# BENCH3: the benchmark's database, raw SQL through JdbcTemplate; WAL,
# synchronous FULL, busy_timeout 5000 as on every side (sqlite-jdbc applies
# them to every connection); a pool of four connections
spring.datasource.url=jdbc:sqlite:${BENCH_SQLITE_DATABASE:bench.sqlite}?journal_mode=WAL&synchronous=FULL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=4
# warnings and errors only, no banner, no request log
logging.level.root=WARN
spring.main.banner-mode=off
server.address=127.0.0.1
server.port=${PORT:8080}
