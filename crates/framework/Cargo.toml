[package]
name = "opengrid-framework"
version = "0.1.0"
edition = "2024"
description = "OpenGrid: Loco hooks, VM worker pool, catch-all routing and the native classes of the dialect"
license = "MIT"

[lib]
name = "opengrid_framework"
path = "src/lib.rs"

[[bin]]
name = "opengrid"
path = "src/bin/opengrid.rs"

[dependencies]
grd-vm = { path = "../vm" }
loco-rs = { version = "1.2.0", default-features = false, features = ["cli"] }
axum = "0.8"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync"] }
serde_json = "1"
tracing = "0.1"
async-trait = "0.1"
matchit = "0.9"
surrealdb = { version = "3.3", features = ["kv-mem", "kv-surrealkv"] }
# Embedded schema sync and rollouts (DECISIONS D4); exact pin while in beta,
# no CLI dependencies. Only as a crate, never vendored (Jonas 24.10.).
surrealkit = { version = "=1.0.0-beta.6", default-features = false, features = ["kv-mem"] }
# SurrealKit reports progress through `log`; forward it into tracing.
tracing-log = "0.2"
chrono = "0.4"
indexmap = "2"
regex = "1"
notify = "8"
getrandom = "0.4"
rust_decimal = "1"
geo = "0.32"
uuid = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
