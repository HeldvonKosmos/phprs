[package]
name = "opengrid-framework"
version = "0.1.0"
edition = "2024"
description = "OpenGrid: Loco hooks, VM worker pool, catch-all routing and the native classes of the dialect"
license = "AGPL-3.0-or-later"

[lib]
name = "opengrid_framework"
path = "src/lib.rs"

[[bin]]
name = "opengrid"
path = "src/bin/opengrid.rs"

[dependencies]
grd-vm = { path = "../vm" }
# JIT for the worker VMs (DECISIONS D8; tier 2 is process-wide)
grd-jit = { path = "../jit" }
# PKG1: the module manager
opengrid-pkg = { path = "../pkg" }
loco-rs = { version = "1.2.0", default-features = false, features = ["cli"] }
axum = "0.8"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync"] }
serde_json = "1"
tracing = "0.1"
async-trait = "0.1"
matchit = "0.9"
surrealdb = { version = "3.3", features = ["kv-mem", "kv-surrealkv"] }
# Embedded schema sync and rollouts (DECISIONS D4); exact pin while in beta,
# no CLI dependencies. Only as a crate, never vendored (Jonas 24.10.).
surrealkit = { version = "=1.0.0-beta.6", default-features = false, features = ["kv-mem"] }
# SurrealKit reports progress through `log`; forward it into tracing.
tracing-log = "0.2"
# rollout manifests for the preflight check
toml = "1"
chrono = "0.4"
indexmap = "2"
regex = "1"
notify = "8"
# D23 (DBR1): raw SQL on SQLite for the framework-core benchmark. Linked
# against the system SQLite (not `bundled`), so PHP's pdo_sqlite and
# OpenGrid use the very same library and version.
rusqlite = "=0.40.2"
getrandom = "0.4"
rust_decimal = "1"
geo = "0.32"
uuid = "1"
mimalloc = "0.1.52"
# MS1: mail templates (the Tera Loco uses) and storage contents
tera = "2.4"
bytes = "1"
# J3: cron expressions (the version Loco's scheduler already pulls in)
croner = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
