[package]
name = "grd-vm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "VM for the OpenGrid dialect (.grd): mago-based front end, slot-compiled op arrays, handle-based object store"
publish = false

[lib]
name = "grd_vm"
path = "src/lib.rs"

[[bin]]
name = "grd"
path = "src/bin/grd.rs"

[dependencies]
mago-syntax = "=1.58.2"
mago-allocator = "=1.58.2"
mago-database = "=1.58.2"
mago-span = "=1.58.2"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
getrandom = "0.4"
serde_json = "1"
fancy-regex = "0.19"
chrono = "0.4"
chrono-tz = "0.10"
bcrypt = "0.19"

[dev-dependencies]
