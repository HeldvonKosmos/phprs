# OpenGrid workspace: crates/vm (grd-vm, the dialect VM), crates/framework
# (Loco hooks, worker pool, natives), crates/pkg (module manager). The old
# phprs core was removed on 2026-10-24; see NOTICE and tag legacy-core-last.
[workspace]
resolver = "2"
members = [
    "crates/vm",
    "crates/framework",
    "crates/pkg",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Debuginfo klein halten (24.10.2026, NACHRICHT 5c): die ~270 Abhängigkeiten ohne
# Debuginfo, eigener Code nur mit Zeilentabellen. Vorher: 2,1 GB je Test-Binary,
# target/debug 221 GB.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
debug = false
