# OpenGrid workspace. The new VM is crates/vm (grd-vm); legacy/core is the
# frozen phprs interpreter kept for its tests and as reference.
[workspace]
resolver = "2"
members = [
    "legacy/core",
    "bin/phprs",
    "crates/vm",
    "crates/framework",
    "crates/pkg",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
debug = true
incremental = true
