# OpenGrid workspace: crates/vm (grd-vm, the dialect VM), crates/framework
# (Loco hooks, worker pool, natives), crates/pkg (module manager). The old
# phprs core was removed on 2026-10-24; see NOTICE and tag legacy-core-last.
[workspace]
resolver = "2"
members = [
    "crates/vm",
    "crates/framework",
    "crates/pkg",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
debug = true
incremental = true
