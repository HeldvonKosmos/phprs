[package]
name = "phprs"
version = "0.1.19"
authors = ["Ying kit WONG"]
license = "Apache-2.0"
description = "PHP interpreter, compiler, runtime VM and package manager written in Rust. Memory-safe host code for running PHP scripts and popular PHP frameworks."
edition = "2024"
repository = "https://github.com/yingkitw/phprs"
homepage = "https://github.com/yingkitw/phprs"
documentation = "https://docs.rs/phprs"
keywords = ["php", "interpreter", "runtime", "compiler", "package-manager"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

# Legacy phprs core (Option A, frozen 2026-10-23). The new VM lives in crates/vm.

[dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
getrandom = "0.2"

# Regular expressions (std engine + fancy-regex for look-around)
regex = "1.10"
fancy-regex = "0.18"

# URL parsing
url = "2.5"

# Unicode handling
unicode-segmentation = "1.11"


[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
debug = true
incremental = true

